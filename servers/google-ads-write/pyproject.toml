[project]
name = "gads-write"
version = "0.1.0"
description = "Write-capable MCP server for the Google Ads API, with a dry-run confirm gate"
requires-python = ">=3.11"
dependencies = [
    "google-ads>=31.0.0",
    "fastmcp>=3.0.0",
]

[project.scripts]
gads-write = "gads_write.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gads_write*"]
